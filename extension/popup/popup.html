<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartGen Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="logo">SmartGen</span>
    <span id="conn-indicator" class="indicator" title="Server connection"></span>
  </div>

  <div class="section">
    <label class="label" for="server-url">Server URL</label>
    <div class="row">
      <input id="server-url" type="text" placeholder="ws://localhost:8000/ws" spellcheck="false">
      <button id="btn-test" class="btn-secondary" title="Test connection">Test</button>
    </div>
    <div id="conn-status" class="hint"></div>
  </div>

  <div class="section">
    <div class="row">
      <div class="field">
        <label class="label" for="src-lang">Source</label>
        <select id="src-lang">
          <option value="vi">Vietnamese</option>
          <option value="en">English</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="tgt-lang">Target</label>
        <select id="tgt-lang">
          <option value="en">English</option>
          <option value="vi">Vietnamese</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <label class="label" for="voice">TTS Voice</label>
    <select id="voice">
      <option value="af_heart">Loading…</option>
    </select>
  </div>

  <div class="section">
    <label class="label" for="volume">Volume</label>
    <input id="volume" type="range" min="0" max="1" step="0.05" value="1">
  </div>

  <div class="footer">
    <button id="btn-save" class="btn-primary">Save</button>
    <span id="saved-msg" class="hint saved-msg"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
